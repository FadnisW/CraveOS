name: CraveOS CI

on:
  push:
    branches: [main, staging, develop, 'feature/**']
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-fakes:
    name: No fake surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check feature registry and banned patterns
        run: node scripts/check-no-fakes.mjs

  verify:
    name: Typecheck, migrate, build and health-check
    needs: no-fakes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: craveos
          POSTGRES_PASSWORD: craveos_password
          POSTGRES_DB: craveos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://craveos:craveos_password@localhost:5432/craveos_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-that-is-never-used-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Typecheck storefront
        run: npm run typecheck

      - name: Typecheck API
        run: npm run typecheck
        working-directory: apps/api

      - name: Build storefront
        run: npm run build

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Verify production startup guard
        run: npm run check:prod-guard

      - name: Verify API readiness probe
        run: npm run check:api-health
